[project]
name = "lumbridge-train"
version = "0.2.0"
description = "Train small decision models from your own work, on your own machine."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lumbridge-train = "lumbridge_train.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lumbridge_train"]
